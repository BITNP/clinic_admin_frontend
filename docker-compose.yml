services:
  admin-frontend:
    # Pre-built image from GHCR; `docker compose up --build` overrides with a local build.
    image: ghcr.io/bitnp/clinic_admin_frontend:${ADMIN_FRONTEND_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://host.docker.internal:8080}
    ports:
      - "${ADMIN_FRONTEND_PORT:-5173}:80"
